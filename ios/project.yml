name: Slate
options:
  bundleIdPrefix: space.s1ate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SLATE_API_BASE_URL: https://www.s1ate.space/api/v1
    GOOGLE_IOS_CLIENT_ID: 712869496808-nounasfl9qtcsdjesijtmk25eptvo416.apps.googleusercontent.com
    GOOGLE_SERVER_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.712869496808-nounasfl9qtcsdjesijtmk25eptvo416
targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - path: Slate
    resources:
      - path: Slate/Resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: GRDB
        product: GRDB
      - target: SlateShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.s1ate.app
        PRODUCT_NAME: slate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Slate/Slate.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Slate/Info.plist
      properties:
        CFBundleDisplayName: slate
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - slate
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        SlateAPIBaseURL: $(SLATE_API_BASE_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
  SlateShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SlateShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.s1ate.app.share
        PRODUCT_NAME: slate share
        SKIP_INSTALL: YES
    info:
      path: SlateShare/Info.plist
      properties:
        CFBundleDisplayName: slate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
